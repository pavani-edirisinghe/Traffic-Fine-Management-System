spring.application.name=demo

# Load local environment files when present (do not commit real secrets)
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]

# --- Database (PostgreSQL) ---
# You can override any of these with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# --- JWT ---
# NOTE: For HS256 this must be >= 32 bytes. Change in production.
app.jwt.secret=change-me-in-prod-change-me-in-prod-change-me-in-prod
app.jwt.expiration-seconds=86400

# --- CORS (frontend dev) ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

